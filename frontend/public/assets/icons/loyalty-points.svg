<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Shadows -->
    <filter id="lp-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#78350f" flood-opacity="0.25" />
    </filter>
    <filter id="lp-medal-shadow" x="-25%" y="-25%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1e1b4b" flood-opacity="0.25" />
    </filter>

    <!-- Coin Gradients -->
    <linearGradient id="lp-coin-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="lp-coin-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Medal Ribbons -->
    <linearGradient id="lp-ribbon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="lp-ribbon-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="26" cy="55" rx="16" ry="4" fill="#78350F" opacity="0.2" />

  <!-- Prestigious Award Ribbon (Behind / Right of coins) -->
  <g filter="url(#lp-medal-shadow)">
    <!-- Blue Ribbon Tail (Left) -->
    <path d="M42 28L38 48L44 45L48 48L46 28Z" fill="url(#lp-ribbon-blue)" />
    <!-- Red Ribbon Tail (Right) -->
    <path d="M46 28L50 49L46 46L41 49L44 28Z" fill="url(#lp-ribbon-red)" />

    <!-- Rosette / Medallion Rosette Petals (Circular Starburst) -->
    <circle cx="44" cy="20" r="14" fill="#2563EB" opacity="0.2" />
    <circle cx="44" cy="20" r="12" fill="#FBBF24" />
    <circle cx="44" cy="20" r="10.5" fill="url(#lp-coin-top)" />
    <!-- Embossed 1st / Star in medal center -->
    <path d="M44 14L45.5 18L49.5 18.5L46.5 21L47.5 25L44 23L40.5 25L41.5 21L38.5 18.5L42.5 18L44 14Z" fill="#B45309" opacity="0.8" />
    <circle cx="43" cy="18" r="1" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Stack of 3 3D Gold Coins (Foreground) -->
  <g filter="url(#lp-shadow)">
    <!-- Coin 1 (Bottom Coin) -->
    <!-- Rim thickness -->
    <path d="M12 45C12 48.5 18.3 51 26 51C33.7 51 40 48.5 40 45V48C40 51.5 33.7 54 26 54C18.3 54 12 51.5 12 48V45Z" fill="url(#lp-coin-rim)" />
    <!-- Top face -->
    <ellipse cx="26" cy="45" rx="14" ry="5.5" fill="url(#lp-coin-top)" />

    <!-- Coin 2 (Middle Coin) -->
    <path d="M12 39C12 42.5 18.3 45 26 45C33.7 45 40 42.5 40 39V42C40 45.5 33.7 48 26 48C18.3 48 12 45.5 12 42V39Z" fill="url(#lp-coin-rim)" />
    <ellipse cx="26" cy="39" rx="14" ry="5.5" fill="url(#lp-coin-top)" />

    <!-- Coin 3 (Top Coin) -->
    <path d="M12 33C12 36.5 18.3 39 26 39C33.7 39 40 36.5 40 33V36C40 39.5 33.7 42 26 42C18.3 42 12 39.5 12 36V33Z" fill="url(#lp-coin-rim)" />
    <ellipse cx="26" cy="33" rx="14" ry="5.5" fill="url(#lp-coin-top)" />

    <!-- Embossed Inner Ring on Top Coin -->
    <ellipse cx="26" cy="33" rx="11" ry="4.2" stroke="#D97706" stroke-width="1.2" />

    <!-- Specular Highlight Arc on Top Coin Rim -->
    <path d="M14 33C14 31 19 28.5 26 28.5C30 28.5 33.5 29.5 36 30.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

    <!-- Embossed Star in Coin Center -->
    <path d="M26 29.5L27.2 32.2L30 32.5L28 34.2L28.6 37L26 35.5L23.4 37L24 34.2L22 32.5L24.8 32.2L26 29.5Z" fill="#B45309" />
  </g>

  <!-- Sparkles -->
  <path d="M10 22C10 24 11 25 13 25C11 25 10 26 10 28C10 26 9 25 7 25C9 25 10 24 10 22Z" fill="#FDE047" />
  <circle cx="10" cy="25" r="1" fill="#FFFFFF" />
  <circle cx="48" cy="40" r="1.5" fill="#FDE047" />
</svg>
