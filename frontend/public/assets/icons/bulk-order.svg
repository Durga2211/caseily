<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Shadows -->
    <filter id="bo-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>

    <!-- Wood Pallet Gradients -->
    <linearGradient id="bo-wood-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bo-wood-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Cardboard Box Gradients (Top-left light) -->
    <linearGradient id="bo-box-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="bo-box-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bo-box-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Tape -->
    <linearGradient id="bo-tape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow under Pallet -->
  <ellipse cx="32" cy="57" rx="22" ry="4.5" fill="#0F172A" opacity="0.2" />

  <g filter="url(#bo-shadow)">
    <!-- 1. Wooden Shipping Pallet at Base -->
    <!-- Pallet Bottom Spacer Blocks -->
    <rect x="11" y="52" width="7" height="3" rx="0.5" fill="#78350F" />
    <rect x="29" y="52" width="6" height="3" rx="0.5" fill="#78350F" />
    <rect x="46" y="52" width="7" height="3" rx="0.5" fill="#78350F" />

    <!-- Pallet Main Deck Planks -->
    <rect x="8" y="49" width="48" height="3.5" rx="1" fill="url(#bo-wood-top)" />
    <!-- Slat separation lines -->
    <line x1="20" y1="49" x2="20" y2="52.5" stroke="#78350F" stroke-width="0.8" />
    <line x1="32" y1="49" x2="32" y2="52.5" stroke="#78350F" stroke-width="0.8" />
    <line x1="44" y1="49" x2="44" y2="52.5" stroke="#78350F" stroke-width="0.8" />

    <!-- 2. Bottom Left Box (Isometric 3D) -->
    <g transform="translate(1, 4)">
      <!-- Left face -->
      <path d="M10 33L23 39V49L10 43V33Z" fill="url(#bo-box-left)" />
      <!-- Right face -->
      <path d="M23 39L35 33V43L23 49V39Z" fill="url(#bo-box-right)" />
      <!-- Top face -->
      <path d="M23 27L35 33L23 39L10 33L23 27Z" fill="url(#bo-box-top)" />
      <!-- Tape line -->
      <path d="M21 28L33 34L31 35.5L19 29.5L21 28Z" fill="url(#bo-tape)" />
      <!-- Label -->
      <polygon points="14,36 19,38 19,41 14,39" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- 3. Bottom Right Box (Isometric 3D) -->
    <g transform="translate(18, 4)">
      <!-- Left face -->
      <path d="M19 33L31 39V49L19 43V33Z" fill="url(#bo-box-left)" />
      <!-- Right face -->
      <path d="M31 39L43 33V43L31 49V39Z" fill="url(#bo-box-right)" />
      <!-- Top face -->
      <path d="M31 27L43 33L31 39L19 33L31 27Z" fill="url(#bo-box-top)" />
      <!-- Tape line -->
      <path d="M29 28L41 34L39 35.5L27 29.5L29 28Z" fill="url(#bo-tape)" />
      <!-- Stamp -->
      <path d="M34 38L36 36L38 38M36 36V40" stroke="#78350F" stroke-width="1" stroke-linecap="round" />
    </g>

    <!-- 4. Top Centered Box (Stack Peak) -->
    <g transform="translate(10, -9)">
      <!-- Shadow cast on boxes below -->
      <ellipse cx="22" cy="38" rx="10" ry="2.5" fill="#451A03" opacity="0.25" />

      <!-- Left face -->
      <path d="M10 26L22 32V42L10 36V26Z" fill="url(#bo-box-left)" />
      <!-- Right face -->
      <path d="M22 32L34 26V36L22 42V32Z" fill="url(#bo-box-right)" />
      <!-- Top face -->
      <path d="M22 20L34 26L22 32L10 26L22 20Z" fill="url(#bo-box-top)" />

      <!-- Top Tape -->
      <path d="M20 21L32 27L30 28.5L18 22.5L20 21Z" fill="url(#bo-tape)" />
      <!-- Tape over flap -->
      <path d="M18 22.5L18 31L21 32.5L21 24L18 22.5Z" fill="url(#bo-tape)" opacity="0.9" />

      <!-- Fragile Red Stamp -->
      <rect x="24" y="29" width="7" height="3" rx="0.5" fill="#EF4444" opacity="0.9" />
      <text x="27.5" y="31.2" fill="#FFFFFF" font-size="1.8" font-weight="900" font-family="-apple-system, sans-serif" text-anchor="middle">FRAGILE</text>
    </g>
  </g>

  <!-- Sparkle Accent -->
  <path d="M50 14C50 16 51 17 53 17C51 17 50 18 50 20C50 18 49 17 47 17C49 17 50 16 50 14Z" fill="#FDE047" />
  <circle cx="50" cy="17" r="1" fill="#FFFFFF" />
</svg>
