<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Drop Shadow Filters -->
    <filter id="cw-shadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <filter id="cw-bubble-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1e1b4b" flood-opacity="0.22" />
    </filter>

    <!-- Board Gradients -->
    <linearGradient id="cw-board-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="cw-board-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Blue Bubble Gradients -->
    <linearGradient id="cw-blue-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cw-blue-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Pink Bubble Gradients -->
    <linearGradient id="cw-pink-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Emerald Bubble Gradients -->
    <linearGradient id="cw-green-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Pin Gradients -->
    <linearGradient id="cw-pin-head" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="40%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- 3D Cork Pinboard Base -->
  <g filter="url(#cw-shadow)">
    <!-- Board Wooden Rim -->
    <rect x="7" y="10" width="50" height="44" rx="10" fill="url(#cw-board-border)" />
    <!-- Cork Board Surface -->
    <rect x="9.5" y="12.5" width="45" height="39" rx="8" fill="url(#cw-board-fill)" />
    <!-- Subtle cork surface texture lines -->
    <circle cx="16" cy="19" r="1.2" fill="#D97706" opacity="0.35" />
    <circle cx="48" cy="20" r="1.5" fill="#D97706" opacity="0.3" />
    <circle cx="49" cy="45" r="1.2" fill="#D97706" opacity="0.35" />
    <circle cx="15" cy="46" r="1.4" fill="#D97706" opacity="0.3" />
  </g>

  <!-- Top Pushpin (Holding the Board) -->
  <g filter="url(#cw-bubble-shadow)">
    <!-- Pin shadow -->
    <ellipse cx="32" cy="14" rx="4.5" ry="2" fill="#78350F" opacity="0.4" />
    <!-- Pin Head Base -->
    <ellipse cx="32" cy="11.5" rx="5" ry="2.2" fill="#B91C1C" />
    <!-- Pin Body Cone -->
    <path d="M28 11.5C28 11.5 29.5 7 32 7C34.5 7 36 11.5 36 11.5Z" fill="url(#cw-pin-head)" />
    <!-- Pin Top Cap Ball -->
    <circle cx="32" cy="6.5" r="4" fill="url(#cw-pin-head)" />
    <!-- Specular highlight on pin ball -->
    <circle cx="30.5" cy="5.2" r="1.2" fill="#FFFFFF" opacity="0.85" />
  </g>

  <!-- Green Chat Bubble (Top Left) -->
  <g filter="url(#cw-bubble-shadow)">
    <path d="M14 26C14 21.6 17.6 18 22 18H28C32.4 18 36 21.6 36 26C36 30.4 32.4 34 28 34H21L16 38V33C14.8 31.2 14 28.7 14 26Z" fill="url(#cw-green-grad)" />
    <!-- Top-left highlight rim -->
    <path d="M16 25C16 22.5 18 20 22 20H28C31 20 33 21 34 22.5" stroke="url(#cw-blue-highlight)" stroke-width="1.2" stroke-linecap="round" />
    <!-- Chat Dots Inside Green Bubble -->
    <circle cx="21" cy="26" r="1.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="25" cy="26" r="1.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="29" cy="26" r="1.5" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Pink Chat Bubble (Right) -->
  <g filter="url(#cw-bubble-shadow)">
    <path d="M30 33C30 29 33.2 25.8 37.2 25.8H43.8C47.8 25.8 51 29 51 33C51 37 47.8 40.2 43.8 40.2H41L38 43.5V39.5C33.5 39.5 30 36.8 30 33Z" fill="url(#cw-pink-grad)" />
    <!-- Top highlight -->
    <path d="M32 32C32 30 34 27.5 37.5 27.5H44" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.6" />
    <!-- Heart Symbol in Pink Bubble -->
    <path d="M40.5 31.2C39.5 30 37.8 30.2 37.2 31.5C36.6 32.8 38.5 34.5 40.5 35.8C42.5 34.5 44.4 32.8 43.8 31.5C43.2 30.2 41.5 30 40.5 31.2Z" fill="#FFFFFF" />
  </g>

  <!-- Big 3D Blue Chat Bubble (Front Focus) -->
  <g filter="url(#cw-bubble-shadow)">
    <!-- Main Body -->
    <path d="M17 35C17 29.5 21.5 25 27 25H37C42.5 25 47 29.5 47 35C47 40.5 42.5 45 37 45H27L20 49.5V43.8C18.2 41.6 17 38.5 17 35Z" fill="url(#cw-blue-grad)" />
    <!-- Glossy Highlight Arch (top-left) -->
    <path d="M19.5 34C19.5 30.5 22.5 27 27 27H37C41 27 43.5 29 44.5 31" stroke="url(#cw-blue-highlight)" stroke-width="1.8" stroke-linecap="round" />
    <!-- Friendly Group Smile Inside Blue Bubble -->
    <circle cx="27" cy="33.5" r="1.8" fill="#FFFFFF" />
    <circle cx="37" cy="33.5" r="1.8" fill="#FFFFFF" />
    <path d="M28.5 37.5C29.5 39.5 34.5 39.5 35.5 37.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
