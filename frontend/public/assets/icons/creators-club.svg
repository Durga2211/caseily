<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Shadows -->
    <filter id="cc-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
    <filter id="cc-crown-shadow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#78350f" flood-opacity="0.35" />
    </filter>

    <!-- Clapper Gradients -->
    <linearGradient id="cc-slate-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cc-stripe-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Crown Gradients -->
    <linearGradient id="cc-crown-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Ground glow -->
  <ellipse cx="32" cy="55" rx="18" ry="4" fill="#0f172a" opacity="0.15" />

  <!-- 3D Clapperboard Base -->
  <g filter="url(#cc-shadow)">
    <!-- Lower Board Body -->
    <rect x="11" y="27" width="42" height="26" rx="4" fill="url(#cc-slate-body)" />
    
    <!-- Top-Left Highlight Edge on Lower Board -->
    <path d="M12 28H52" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
    
    <!-- Production Slate Lines & Markings (Vibrant Jio/App style) -->
    <rect x="16" y="33" width="14" height="6" rx="1.5" fill="#3B82F6" opacity="0.9" />
    <text x="23" y="37.5" fill="#FFFFFF" font-size="3.5" font-weight="900" font-family="-apple-system, sans-serif" text-anchor="middle">SCENE</text>

    <rect x="33" y="33" width="15" height="6" rx="1.5" fill="#EC4899" opacity="0.9" />
    <text x="40.5" y="37.5" fill="#FFFFFF" font-size="3.5" font-weight="900" font-family="-apple-system, sans-serif" text-anchor="middle">TAKE</text>

    <!-- Lower chalk lines -->
    <rect x="16" y="43" width="32" height="2" rx="1" fill="#64748B" opacity="0.6" />
    <rect x="16" y="47" width="22" height="1.8" rx="0.9" fill="#64748B" opacity="0.4" />
    
    <!-- Fixed Hinge / Stick Bar (Horizontal) -->
    <rect x="11" y="22" width="42" height="6.5" rx="2" fill="url(#cc-stripe-dark)" />
    <!-- White Stripes on Lower Stick -->
    <polygon points="16,22 22,22 17,28.5 11,28.5" fill="#F8FAFC" />
    <polygon points="27,22 33,22 28,28.5 22,28.5" fill="#F8FAFC" />
    <polygon points="38,22 44,22 39,28.5 33,28.5" fill="#F8FAFC" />
    <polygon points="49,22 53,22 50,28.5 44,28.5" fill="#F8FAFC" />

    <!-- Open Top Clapper Stick (Angled Up 18deg) -->
    <g transform="translate(11, 23) rotate(-18)">
      <rect x="0" y="-7" width="42" height="7" rx="2.5" fill="url(#cc-stripe-dark)" />
      <!-- White Diagonal Stripes on Top Clapper -->
      <polygon points="5,-7 11,-7 6,0 0,0" fill="#F8FAFC" />
      <polygon points="16,-7 22,-7 17,0 11,0" fill="#F8FAFC" />
      <polygon points="27,-7 33,-7 28,0 22,0" fill="#F8FAFC" />
      <polygon points="38,-7 42,-7 39,0 33,0" fill="#F8FAFC" />
      <!-- Top stick gloss highlight -->
      <line x1="1" y1="-6" x2="41" y2="-6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Metal Pivot Joint Pin -->
    <circle cx="13" cy="23.5" r="2.8" fill="#E2E8F0" />
    <circle cx="13" cy="23.5" r="1.5" fill="#64748B" />
  </g>

  <!-- 3D Glossy Golden Crown Floating on Top -->
  <g filter="url(#cc-crown-shadow)">
    <!-- Crown Base Band -->
    <path d="M22 15C22 13.5 24 13 32 13C40 13 42 13.5 42 15L43.5 18C43.5 19 41.5 19.5 32 19.5C22.5 19.5 20.5 19 20.5 18L22 15Z" fill="url(#cc-crown-gold)" />
    
    <!-- Crown Peaks -->
    <path d="M22 15L24 7L28 14L32 5L36 14L40 7L42 15C42 15 37 17 32 17C27 17 22 15 22 15Z" fill="url(#cc-crown-gold)" />

    <!-- Crown Jewels / Pearl Balls on Tips -->
    <circle cx="32" cy="5" r="2" fill="#FEF08A" />
    <circle cx="32" cy="4.5" r="0.8" fill="#FFFFFF" />

    <circle cx="24" cy="7" r="1.6" fill="#F43F5E" />
    <circle cx="40" cy="7" r="1.6" fill="#38BDF8" />

    <!-- Crown Band Center Gem -->
    <ellipse cx="32" cy="16.5" rx="2.5" ry="1.6" fill="#EF4444" />
    <ellipse cx="32" cy="16" rx="1.2" ry="0.8" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Star Sparkles -->
  <path d="M51 10C51 13 53 14 55 14C53 14 51 15 51 18C51 15 49 14 47 14C49 14 51 13 51 10Z" fill="#FDE047" />
  <circle cx="51" cy="14" r="1.2" fill="#FFFFFF" />

  <path d="M10 38C10 40 11 41 12 41C11 41 10 42 10 44C10 42 9 41 8 41C9 41 10 40 10 38Z" fill="#38BDF8" />
</svg>
