<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Shadows -->
    <filter id="sw-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
    <filter id="sw-heart-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#881337" flood-opacity="0.3" />
    </filter>
    <filter id="sw-sprout-shadow" x="-25%" y="-25%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#064e3b" flood-opacity="0.25" />
    </filter>

    <!-- Heart Gradients (3D Glossy Ruby/Coral) -->
    <linearGradient id="sw-heart-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="25%" stop-color="#FB7185" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="sw-heart-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Hands Gradients (Warm gentle 3D hands) -->
    <linearGradient id="sw-hand-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="40%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="sw-hand-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="40%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="sw-hand-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Sprout / Leaf Gradients -->
    <linearGradient id="sw-sprout-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sw-sprout-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sparkle Gold -->
    <linearGradient id="sw-sparkle-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Heart -->
  <circle cx="32" cy="27" r="16" fill="#F43F5E" opacity="0.15" />

  <!-- 3D Sprout / Leaf Rising from Behind Heart -->
  <g filter="url(#sw-sprout-shadow)">
    <!-- Stem -->
    <path d="M32 23C32 17 31 12 30 8" stroke="url(#sw-sprout-stem)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Left Leaf -->
    <path d="M30.5 12C26 12 23 15 23 18C27 19 30 16 30.5 12Z" fill="url(#sw-sprout-grad)" />
    <!-- Right Leaf -->
    <path d="M30.5 10C35 9 39 12 38 16C34 16 31 13 30.5 10Z" fill="url(#sw-sprout-grad)" />
    <!-- Leaf Highlights -->
    <path d="M25 16C27 16 29 14.5 29.5 12.5" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
    <path d="M33 11C35 12 36.5 13.5 36.5 15" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Big 3D Ruby Heart (Center Object) -->
  <g filter="url(#sw-heart-shadow)">
    <!-- Heart Main Shape -->
    <path d="M32 39.5C30.5 38.2 16 27.5 16 19.5C16 14.2 20.2 10 25.5 10C28.4 10 31 11.4 32 12.8C33 11.4 35.6 10 38.5 10C43.8 10 48 14.2 48 19.5C48 27.5 33.5 38.2 32 39.5Z" fill="url(#sw-heart-grad)" />
    
    <!-- Left Lobe Glossy Highlight -->
    <path d="M25 12.5C21.5 12.5 18.5 15.5 18.5 19.5C18.5 22.5 22 27 26 31" stroke="url(#sw-heart-highlight)" stroke-width="2.2" stroke-linecap="round" />
    <!-- Right Lobe Specular Dot -->
    <ellipse cx="38" cy="14" rx="3.5" ry="1.8" transform="rotate(-25 38 14)" fill="#FFFFFF" opacity="0.75" />
    
    <!-- Heart Core Soft Glow -->
    <ellipse cx="32" cy="24" rx="8" ry="6" fill="#FDA4AF" opacity="0.4" />
  </g>

  <!-- 3D Caring Hands Cradling Heart from Below -->
  <g filter="url(#sw-shadow)">
    <!-- Left Hand -->
    <path d="M10 46C12 43 17 40 22 42C25 43.2 28 45.5 31 48C30 50 26 53 22 53C17 53 11 50 10 46Z" fill="url(#sw-hand-left)" />
    <!-- Left Fingers Curved Around Heart -->
    <path d="M12 43C16 38 23 37 27 41C25 43 21 44 17 44C14 44 12.5 43.5 12 43Z" fill="url(#sw-hand-left)" />
    <path d="M12 43C15 39 21 38 25 41" stroke="url(#sw-hand-edge)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Right Hand -->
    <path d="M54 46C52 43 47 40 42 42C39 43.2 36 45.5 33 48C34 50 38 53 42 53C47 53 53 50 54 46Z" fill="url(#sw-hand-right)" />
    <!-- Right Fingers Curved Around Heart -->
    <path d="M52 43C48 38 41 37 37 41C39 43 43 44 47 44C50 44 51.5 43.5 52 43Z" fill="url(#sw-hand-right)" />
    <path d="M52 43C49 39 43 38 39 41" stroke="url(#sw-hand-edge)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Supporting Palms Meeting at Bottom -->
    <path d="M22 51C26 53 30 54 32 54C34 54 38 53 42 51C39 55 35 56 32 56C29 56 25 55 22 51Z" fill="#C2410C" />
    <path d="M23 49C27 51 30 52 32 52C34 52 37 51 41 49C38 53 35 54 32 54C29 54 26 53 23 49Z" fill="url(#sw-hand-left)" />
    <!-- Palm Highlight -->
    <path d="M25 50C29 52 35 52 39 50" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Golden Community Care Sparkles -->
  <!-- Top Right Sparkle -->
  <path d="M51 16L52 18.5L54.5 19.5L52 20.5L51 23L50 20.5L47.5 19.5L50 18.5Z" fill="url(#sw-sparkle-gold)" />
  <!-- Top Left Small Sparkle -->
  <path d="M13 18L13.8 19.8L15.5 20.5L13.8 21.2L13 23L12.2 21.2L10.5 20.5L12.2 19.8Z" fill="url(#sw-sparkle-gold)" />
  <!-- Bottom Accent Dot -->
  <circle cx="53" cy="27" r="1.5" fill="#38BDF8" />
  <circle cx="11" cy="28" r="1.2" fill="#FBBF24" />
</svg>
