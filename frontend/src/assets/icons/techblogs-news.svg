<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Shadows -->
    <filter id="tn-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
    <filter id="tn-mic-shadow" x="-25%" y="-25%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>

    <!-- Newspaper Gradients -->
    <linearGradient id="tn-paper-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="tn-paper-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="tn-red-banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Microphone Gradients -->
    <radialGradient id="tn-mic-grille" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="45%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <linearGradient id="tn-mic-flag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="tn-mic-handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- 3D Newspaper Folded Base -->
  <g filter="url(#tn-shadow)">
    <!-- Back Page / Depth Layer -->
    <path d="M12 11C12 9.5 13.5 8 15 8H45C46.5 8 48 9.5 48 11V47L12 47V11Z" fill="url(#tn-paper-back)" />

    <!-- Main Front Newspaper Page (Folded) -->
    <path d="M15 11C15 9.5 16.5 8.5 18 8.5H46C47.5 8.5 49 9.5 49 11V50C49 51.5 47.5 53 46 53H18C16.5 53 15 51.5 15 50V11Z" fill="url(#tn-paper-front)" />
    
    <!-- Red Header / Masthead Banner with "NEWS" -->
    <rect x="18" y="12" width="28" height="6.5" rx="1.5" fill="url(#tn-red-banner)" />
    <!-- "NEWS" text on banner -->
    <text x="32" y="17" fill="#FFFFFF" font-size="4.8" font-weight="900" font-family="-apple-system, sans-serif" text-anchor="middle" letter-spacing="0.6">NEWS</text>

    <!-- Newspaper Photo Placeholder -->
    <rect x="18" y="21" width="13" height="11" rx="1.5" fill="#E2E8F0" />
    <path d="M21 29L24 25L28 29" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="27" cy="24" r="1.2" fill="#F59E0B" />

    <!-- Headline and article text lines -->
    <rect x="33" y="22" width="13" height="2" rx="1" fill="#475569" />
    <rect x="33" y="26" width="11" height="1.4" rx="0.7" fill="#94A3B8" />
    <rect x="33" y="29" width="12" height="1.4" rx="0.7" fill="#94A3B8" />

    <rect x="18" y="35" width="28" height="1.4" rx="0.7" fill="#94A3B8" />
    <rect x="18" y="38" width="25" height="1.4" rx="0.7" fill="#94A3B8" />
    <rect x="18" y="41" width="28" height="1.4" rx="0.7" fill="#94A3B8" />
    <rect x="18" y="44" width="20" height="1.4" rx="0.7" fill="#94A3B8" />
    <rect x="18" y="47" width="26" height="1.4" rx="0.7" fill="#94A3B8" />
  </g>

  <!-- 3D Reporter Microphone Lying Diagonally -->
  <g filter="url(#tn-mic-shadow)">
    <!-- Mic Cast Shadow on Paper -->
    <ellipse cx="44" cy="38" rx="7" ry="14" transform="rotate(-30 44 38)" fill="#0F172A" opacity="0.18" />

    <!-- Mic Handle (pointing down right) -->
    <path d="M43 38L51 52C51.5 53 52.8 53.5 53.8 53L54.5 52.5C55.5 52 56 50.5 55 49.5L47 36L43 38Z" fill="url(#tn-mic-handle)" />

    <!-- Mic Cube Flag (Red Box) -->
    <g transform="translate(37, 28) rotate(-30)">
      <rect x="-1" y="0" width="11" height="9" rx="1.8" fill="url(#tn-mic-flag)" />
      <!-- Mic Flag Highlight -->
      <path d="M0 1H9" stroke="#FECACA" stroke-width="0.8" opacity="0.8" />
      <text x="4.5" y="6.5" fill="#FFFFFF" font-size="3.2" font-weight="900" font-family="-apple-system, sans-serif" text-anchor="middle">LIVE</text>
    </g>

    <!-- Mic Spherical Grille / Head -->
    <circle cx="37" cy="24" r="8" fill="url(#tn-mic-grille)" />
    <!-- Mesh pattern arc lines -->
    <path d="M31 24C31 20 34 17 38 17" stroke="#94A3B8" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
    <path d="M33 27C33 23 37 19 41 19" stroke="#94A3B8" stroke-width="0.8" stroke-linecap="round" opacity="0.4" />
    <!-- Specular Highlight (top-left ball glint) -->
    <circle cx="34" cy="20.5" r="2" fill="#FFFFFF" opacity="0.85" />
    
    <!-- Metallic collar ring below head -->
    <rect x="38" y="27" width="5" height="2" rx="0.8" transform="rotate(-30 38 27)" fill="#E2E8F0" />
  </g>
</svg>
